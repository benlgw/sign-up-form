<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="styles.css" />
		<script src="scripts.js"></script>
		<title>Sign-Up Form</title>
	</head>
	<body>
		<div class="container">
			<img src="assets/bg-image.jpg" class="bg-image" />
			<div class="logo-container">
				<img src="assets/odin-lined.png" class="logo" />
				<span class="logo-text">ODIN</span>
			</div>
			<span class="bg-credit"
				>Photo by
				<a
					src="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA"
					>Halie West</a
				>
				on <a src="https://unsplash.com/">Unsplash</a> ></span
			>
		</div>
		<div class="container">
			<header>
				<h2>
					This is not a real online service! You know you need something like
					this in your life to help you realize your deepest dreams. Sign up
					<em>now</em> to get started.
				</h2>
				<h2>You know you want to.</h2>
			</header>
			<form action="" method="post">
				<div class="form">
					<h2>Let's do this!</h2>
					<div class="name">
						<div class="input">
							<label for="first-name">FIRST NAME</label>
							<input type="text" id="first-name" name="first-name" />
						</div>
						<div class="input">
							<label for="last-name">LAST NAME</label>
							<input type="text" id="last-name" name="last-name" />
						</div>
					</div>
					<div class="contact">
						<div class="input">
							<label for="email">EMAIL</label>
							<input type="email" id="email" name="email" />
						</div>
						<div class="input">
							<label for="phone-num">PHONE NUMBER</label>
							<input type="tel" id="phone-num" name="phone-num" />
						</div>
					</div>
					<div class="password">
						<div class="input">
							<label for="password">PASSWORD</label>
							<input type="password" id="password" name="password" />
						</div>
						<div class="input">
							<label for="confirm-password">CONFIRM PASSWORD</label>
							<input
								type="password"
								id="confirm-password"
								name="confirm-password"
							/>
						</div>
					</div>
				</div>
				<button>Create Account</button>
			</form>
			<p>Already have an account? <a>Log in</a></p>
		</div>
	</body>
</html>
